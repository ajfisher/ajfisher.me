name: Build astro site
on: [ push ]
jobs:
    build:
        name: Build the astro site code
        runs-on: ubuntu-latest
        env:
            ASTRO_PATH: ./site.v5/

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: site.v5/package-lock.json

            - name: Install astro site deps
              run: cd site.v5 && npm ci

            - name: Lint and astro check
              run: cd site.v5 && make lint && make check

            - name: Build output files
              run: cd site.v5 && make sync && make build

            - name: Configure AWS CLI
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ap-southeast-2
              if: github.ref == 'refs/heads/master'

            - name: Sync files to S3
              run: aws s3 sync ./site.v5/dist/ s3://aj-web-ajfisher-me-prod/ --delete
              if: github.ref == 'refs/heads/master'
